<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="rgb(16,185,129)" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="rgb(12,16,14)"  stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none"
            stroke="rgba(34,197,94,0.06)" stroke-width="1"/>
    </pattern>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip-canvas">
      <rect width="1440" height="900"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="rgb(12,16,14)"/>
  <!-- Subtle grid -->
  <rect width="1440" height="900" fill="url(#grid)"/>
  <!-- Radial glow centred on the plan -->
  <rect width="1440" height="900" fill="url(#glow)"/>

  <!-- === Floor Plan — offset slightly left-centre === -->
  <g clip-path="url(#clip-canvas)" transform="translate(720,450) rotate(-8) translate(-280,-200)">

    <!-- Outer building shell -->
    <rect x="0" y="0" width="560" height="400"
          fill="none" stroke="rgba(34,197,94,0.55)" stroke-width="2.5"/>

    <!-- Room dividers — horizontal -->
    <line x1="0"   y1="160" x2="560" y2="160"
          stroke="rgba(34,197,94,0.35)" stroke-width="1.5"/>
    <line x1="0"   y1="280" x2="340" y2="280"
          stroke="rgba(34,197,94,0.35)" stroke-width="1.5"/>

    <!-- Room dividers — vertical -->
    <line x1="200" y1="0"   x2="200" y2="160"
          stroke="rgba(34,197,94,0.35)" stroke-width="1.5"/>
    <line x1="340" y1="160" x2="340" y2="400"
          stroke="rgba(34,197,94,0.35)" stroke-width="1.5"/>
    <line x1="200" y1="280" x2="200" y2="400"
          stroke="rgba(34,197,94,0.35)" stroke-width="1.5"/>

    <!-- Door arcs -->
    <path d="M 200 0 A 40 40 0 0 1 160 40"
          fill="none" stroke="rgba(34,197,94,0.45)" stroke-width="1.2" stroke-dasharray="3,3"/>
    <path d="M 340 160 A 40 40 0 0 0 380 200"
          fill="none" stroke="rgba(34,197,94,0.45)" stroke-width="1.2" stroke-dasharray="3,3"/>
    <path d="M 0 280 A 40 40 0 0 1 40 240"
          fill="none" stroke="rgba(34,197,94,0.45)" stroke-width="1.2" stroke-dasharray="3,3"/>
    <path d="M 200 400 A 40 40 0 0 0 240 360"
          fill="none" stroke="rgba(34,197,94,0.45)" stroke-width="1.2" stroke-dasharray="3,3"/>

    <!-- Window ticks on outer walls -->
    <line x1="80"  y1="0"   x2="80"  y2="-10" stroke="rgba(34,197,94,0.6)" stroke-width="1.5"/>
    <line x1="120" y1="0"   x2="120" y2="-10" stroke="rgba(34,197,94,0.6)" stroke-width="1.5"/>
    <line x1="80"  y1="0"   x2="120" y2="0"   stroke="rgba(34,197,94,0.6)" stroke-width="1.5"/>

    <line x1="420" y1="0"   x2="420" y2="-10" stroke="rgba(34,197,94,0.6)" stroke-width="1.5"/>
    <line x1="460" y1="0"   x2="460" y2="-10" stroke="rgba(34,197,94,0.6)" stroke-width="1.5"/>
    <line x1="420" y1="0"   x2="460" y2="0"   stroke="rgba(34,197,94,0.6)" stroke-width="1.5"/>

    <line x1="560" y1="50"  x2="570" y2="50"  stroke="rgba(34,197,94,0.6)" stroke-width="1.5"/>
    <line x1="560" y1="90"  x2="570" y2="90"  stroke="rgba(34,197,94,0.6)" stroke-width="1.5"/>
    <line x1="560" y1="50"  x2="560" y2="90"  stroke="rgba(34,197,94,0.6)" stroke-width="1.5"/>

    <!-- Room labels (small, low-opacity) -->
    <text x="94"  y="90"  font-family="monospace" font-size="11"
          fill="rgba(34,197,94,0.4)" text-anchor="middle">Living</text>
    <text x="260" y="90"  font-family="monospace" font-size="11"
          fill="rgba(34,197,94,0.4)" text-anchor="middle">Dining</text>
    <text x="440" y="90"  font-family="monospace" font-size="11"
          fill="rgba(34,197,94,0.4)" text-anchor="middle">Kitchen</text>
    <text x="94"  y="230" font-family="monospace" font-size="11"
          fill="rgba(34,197,94,0.4)" text-anchor="middle">Bed 1</text>
    <text x="270" y="230" font-family="monospace" font-size="11"
          fill="rgba(34,197,94,0.4)" text-anchor="middle">Bath</text>
    <text x="440" y="230" font-family="monospace" font-size="11"
          fill="rgba(34,197,94,0.4)" text-anchor="middle">Bed 2</text>
    <text x="94"  y="350" font-family="monospace" font-size="11"
          fill="rgba(34,197,94,0.4)" text-anchor="middle">Hall</text>
    <text x="270" y="350" font-family="monospace" font-size="11"
          fill="rgba(34,197,94,0.4)" text-anchor="middle">Utility</text>
    <text x="440" y="350" font-family="monospace" font-size="11"
          fill="rgba(34,197,94,0.4)" text-anchor="middle">Garage</text>

    <!-- Dimension leader lines -->
    <line x1="0" y1="420" x2="560" y2="420"
          stroke="rgba(34,197,94,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0"   y1="415" x2="0"   y2="425" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
    <line x1="560" y1="415" x2="560" y2="425" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
    <text x="280" y="436" font-family="monospace" font-size="10"
          fill="rgba(34,197,94,0.35)" text-anchor="middle">12 000 mm</text>

    <line x1="-20" y1="0" x2="-20" y2="400"
          stroke="rgba(34,197,94,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="-25" y1="0"   x2="-15" y2="0"   stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
    <line x1="-25" y1="400" x2="-15" y2="400" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
    <text x="-34" y="202" font-family="monospace" font-size="10"
          fill="rgba(34,197,94,0.35)" text-anchor="middle"
          transform="rotate(-90,-34,202)">8 600 mm</text>

    <!-- Compass rose (top-right corner of plan) -->
    <g transform="translate(590,20)" filter="url(#blur-glow)">
      <line x1="0" y1="0" x2="0"  y2="-20" stroke="rgba(34,197,94,0.7)" stroke-width="1.5"/>
      <polygon points="0,-22 -5,-12 5,-12"  fill="rgba(34,197,94,0.7)"/>
      <text x="0" y="-26" font-family="monospace" font-size="9"
            fill="rgba(34,197,94,0.7)" text-anchor="middle">N</text>
    </g>

  </g>

  <!-- Decorative scan-line overlay (very subtle) -->
  <rect width="1440" height="900" fill="none"
        stroke="rgba(34,197,94,0.03)" stroke-width="1"
        style="stroke-dasharray:1 2"/>

  <!-- Brand wordmark, bottom-right -->
  <text x="1400" y="878" font-family="monospace" font-size="12"
        fill="rgba(34,197,94,0.3)" text-anchor="end" letter-spacing="2">ARCHIVOX</text>
</svg>
