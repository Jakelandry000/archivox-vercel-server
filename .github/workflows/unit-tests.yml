name: unit-tests

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  test:
    name: Core unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        env:
          CI: true
