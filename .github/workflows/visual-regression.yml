name: visual-regression

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'e2e/**'
      - 'playwright.config.ts'

permissions:
  contents: read
  pull-requests: write

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run visual regression tests
        run: npm run test:e2e:visual
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Upload snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs-${{ github.run_id }}
          path: test-results/
          retention-days: 7

      - name: Comment snapshot diff on PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## Visual Regression Failure',
                '',
                'One or more visual snapshot comparisons failed on this PR.',
                '',
                `Download the diff artifacts from [this workflow run](${runUrl}) to inspect which snapshots changed.`,
                '',
                'To update baselines after an intentional UI change, run locally:',
                '```',
                'npm run test:e2e:visual:update',
                '```',
                'Then commit the updated snapshots under `e2e/__snapshots__/`.',
              ].join('\n'),
            });
